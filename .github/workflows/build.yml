name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk Umnozhaika.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Umnozhaika-apk
          path: Umnozhaika.apk

      - name: Publish to Releases
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest -y --cleanup-tag || true
          gh release create latest Umnozhaika.apk \
            --title "Умножайка — сборка №${{ github.run_number }}" \
            --notes "Скачайте Umnozhaika.apk и установите на телефон ребёнка. Секретный код родителя: см. README."
